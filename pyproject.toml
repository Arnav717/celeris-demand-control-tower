[project]
name = "celeris"
version = "0.1.0"
description = "Celeris Automobili demand forecasting & planning control tower"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "statsforecast>=1.7",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "ruptures>=1.1",
  "streamlit>=1.35",
  "plotly>=5.20",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
