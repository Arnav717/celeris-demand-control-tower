<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celeris Control Tower</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M8 21l5-6 4 3 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    try { const t = localStorage.getItem("celeris-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div><div class="brand-name">CELERIS</div><div class="brand-sub">Planning control tower</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      Every number on these pages is read from the pipeline outputs.
      <br>Shortcuts: <kbd>1</kbd>–<kbd>9</kbd> switch views, <kbd>/</kbd> filters.
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-row">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <div>
          <h1 class="page-title" id="pageTitle">Executive overview</h1>
          <div class="page-sub" id="pageSub"></div>
        </div>
        <div class="top-actions">
          <span class="stamp" id="stamp"></span>
          <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor"/></svg></button>
        </div>
      </div>
      <div class="filters" id="filters"></div>
    </header>
    <section class="content" id="content"><div class="loading">Loading pipeline outputs…</div></section>
  </main>
</div>
<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
